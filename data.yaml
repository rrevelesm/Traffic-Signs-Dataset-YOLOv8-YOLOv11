# Traffic Signs Dataset Configuration
# For YOLOv8-YOLOv11 Benchmarking Research
# Source: Roboflow workspace (fira-gpeby/signals-ocroa)

path: .
train: train/images
val: valid/images
test: test/images

# Number of classes
nc: 6

# Class names (as defined in the article)
names:
  0: left_turn
  1: straight_ahead
  2: right_turn
  3: dead_end
  4: no_entry
  5: stop

# Dataset information
roboflow:
  workspace: fira-gpeby
  project: signals-ocroa
  version: 1
  license: Private
  url: https://app.roboflow.com/fira-gpeby/signals-ocroa/1

# Statistics
dataset_stats:
  train_images: 4200
  valid_images: 1200
  test_images: 600
  total_images: 6000
